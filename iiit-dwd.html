<script>
const D={"course_title": "Python Programming - Mid-Semester", "units": [{"unit_number": "Unit II", "unit_title": "Introduction to Python", "topics": [{"topic_id": "U2_T1", "topic_name": "Python Overview, Execution Model & Working Modes", "theory_concepts": [{"subtopic": "What Is Python?", "points": ["Python is a high-level, general-purpose programming language designed for readability and rapid development.", "It supports procedural, object-oriented, and functional programming styles.", "Python programs are typically concise because many common operations are built into the language and standard library.", "Python is widely used for scripting, web development, data analysis, AI/ML, automation, cybersecurity, and scientific computing."]}, {"subtopic": "Why Python? (Strengths & Applications)", "points": ["Strengths: Readable syntax, large standard library, cross-platform compatibility, interactive development, huge package ecosystem, and rapid prototyping.", "Typical Applications: Automation and scripting, web applications, data science, AI / machine learning, scientific computing, and cybersecurity tools."]}, {"subtopic": "Python Program Execution - Big Picture", "points": ["Step 1 (Write Source Program): Programmer writes human-readable code in a text file with a .py extension (e.g., example.py).", "Step 2 (Interpreter Reads Program): The Python interpreter reads the source file. The Parser checks for syntax errors and, if syntax is correct, builds an internal representation called an Abstract Syntax Tree (AST).", "Step 3 (Compile to Bytecode): The compiler translates source code into bytecode (.pyc)—a low-level, machine-independent representation (e.g., LOAD_CONST, STORE_NAME, BINARY_ADD, CALL_FUNCTION) optionally stored in .pyc files for faster loading.", "Step 4 (Execute Using PVM): The Python Virtual Machine (PVM) is a stack-based virtual machine that fetches, decodes, and executes bytecode instruction by instruction while managing memory, objects, and runtime services.", "Step 5 & 6 (Libraries & Output): Built-in functions (print, len, type), standard library modules (math, random, os), and external packages (numpy, pandas) are linked, and the PVM interacts with the Operating System and hardware to display output.", "Dynamic Typing: Variable types are associated with objects at runtime."]}, {"subtopic": "Interactive Mode vs. Script Mode", "points": ["Interactive Mode: Enter one statement or expression at a time at the >>> prompt and receive immediate results. Ideal for experimentation, quick calculations, and learning, with no need to save first, though not ideal for large programs.", "Script Mode: Save a sequence of statements in a .py file and execute the file. Preserves work, can contain many statements, is reusable and shareable, easy to edit/test, and preferred for applications."]}], "original_examples": [{"name": "original example - Bytecode Execution Example (example.py)", "problem_logic": "Human-readable .py file compiled into bytecode and executed by the PVM.", "code": "x = 10\ny = 20\nprint(\"Sum:\", x + y) # add two numbers", "sample_run": "Sum: 30"}, {"name": "original example - Our First Python Program", "problem_logic": "print() sends values to the standard output.", "code": "print(\"Hello, Python!\")\nprint(\"Welcome to problem solving with Python.\")", "sample_run": "Hello, Python!\nWelcome to problem solving with Python."}, {"name": "original example - Interactive Mode Exploration", "problem_logic": "The >>> prompt indicates an interactive Python session to try expressions immediately without creating a complete program.", "code": ">>> 5 + 3\n8\n>>> 10 / 4\n2.5\n>>> name = 'Asha'\n>>> name.upper()\n'ASHA'\n>>> 2 ** 10\n1024\n>>> len('Python')\n6\n>>> type(3.14)\n<class 'float'>\n>>> max(4, 9, 2)\n9", "sample_run": "Immediate evaluation after each expression."}, {"name": "original example - Script Mode (area.py)", "problem_logic": "Save the program in a .py file and run it repeatedly. Script mode preserves your work.", "code": "# file: area.py\nradius = 5\narea = 3.14159 * radius ** 2\nprint(\"Area =\", area)", "sample_run": "Area = 78.53975"}], "similar_coding_questions": [{"level": 1, "title": "Personal Bio Script (Class Activity)", "question": "Create a script that reads your name and department from input, and prints your name, department, and the sentence 'Python is great for rapid prototyping.' on three separate lines.", "solution_code": "name = input()\ndept = input()\nprint(name)\nprint(dept)\nprint(\"Python is great for rapid prototyping.\")", "test_cases": [{"input": "Asha\nCSE", "expected_output": "Asha\nCSE\nPython is great for rapid prototyping."}]}, {"level": 2, "title": "Predict and Try Expressions (Class Activity)", "question": "Write a script that evaluates and prints the following 5 expressions on separate lines: 17 // 5, 17 % 5, 2 ** 8, abs(-23), and round(7.856, 2).", "solution_code": "print(17 // 5)\nprint(17 % 5)\nprint(2 ** 8)\nprint(abs(-23))\nprint(round(7.856, 2))", "test_cases": [{"input": "", "expected_output": "3\n2\n256\n23\n7.86"}]}, {"level": 3, "title": "Rectangle Area & Perimeter (Practice Problem L1.1)", "question": "Read length and breadth as floats on two lines; display the area and perimeter of the rectangle rounded to 2 decimal places.", "solution_code": "length = float(input())\nbreadth = float(input())\narea = length * breadth\nperimeter = 2 * (length + breadth)\nprint(f\"Area = {area:.2f}\")\nprint(f\"Perimeter = {perimeter:.2f}\")", "test_cases": [{"input": "10\n5", "expected_output": "Area = 50.00\nPerimeter = 30.00"}, {"input": "4.5\n2.5", "expected_output": "Area = 11.25\nPerimeter = 14.00"}]}, {"level": 4, "title": "Cylinder Surface Area & Volume", "question": "Read radius and height as floats. Using pi = 3.14159, compute and print the volume (pi * r^2 * h) and total surface area (2 * pi * r * (r + h)) rounded to 2 decimal places.", "solution_code": "r = float(input())\nh = float(input())\npi = 3.14159\nvol = pi * (r ** 2) * h\ntsa = 2 * pi * r * (r + h)\nprint(f\"Volume = {vol:.2f}\")\nprint(f\"Surface Area = {tsa:.2f}\")", "test_cases": [{"input": "5\n10", "expected_output": "Volume = 785.40\nSurface Area = 471.24"}]}], "quiz_questions": [{"question": "What is the role of the Python Virtual Machine (PVM) in program execution?", "options": ["It converts C code into Python source files", "It executes compiled machine-independent bytecode instruction by instruction", "It checks only for variable naming conventions before saving the file", "It serves as a text editor for writing .py files"], "answer": "It executes compiled machine-independent bytecode instruction by instruction", "explanation": "The PVM is a stack-based virtual machine that fetches, decodes, and executes compiled bytecode (.pyc) instruction by instruction."}, {"question": "Which internal representation is built by the Python Parser after checking for syntax errors?", "options": ["Abstract Syntax Tree (AST)", "Operating System Kernel", "Binary Executable (.exe)", "Document Object Model (DOM)"], "answer": "Abstract Syntax Tree (AST)", "explanation": "The parser checks syntax and builds an Abstract Syntax Tree (AST) before the compiler translates it to bytecode."}, {"question": "Which mode is more suitable for a 100-line reusable program and why?", "options": ["Interactive mode, because it shows the >>> prompt", "Script mode, because code is saved in a .py file and can be edited, tested, maintained, and reused repeatedly", "Interactive mode, because it does not require saving", "Neither mode supports programs over 50 lines"], "answer": "Script mode, because code is saved in a .py file and can be edited, tested, maintained, and reused repeatedly", "explanation": "Script mode preserves your work in a .py file and is preferred for maintainable applications."}, {"question": "What does it mean that Python is 'dynamically typed'?", "options": ["Objects in Python do not have any data types", "Variable types are associated with objects at runtime rather than declared prior to assignment", "Variables cannot change their value once assigned", "Only numeric types are supported"], "answer": "Variable types are associated with objects at runtime rather than declared prior to assignment", "explanation": "In Python, objects have types at runtime, and a variable name is simply a reference that can be rebound to objects of different types."}]}, {"topic_id": "U2_T2", "topic_name": "Syntax, Indentation, Comments, Identifiers, Variables & Keywords", "summary": "Covers block structuring with 4-space indentation, single-line comments (#), docstrings (\"\"\" \"\"\"), variable binding, dynamic typing, identifier naming rules, multiple assignment/swapping, and reserved keywords.", "original_examples": [{"name": "original example - Indentation (Correct vs Incorrect)", "problem_logic": "Demonstrates how Python uses indentation to group statements into blocks after a colon (:).", "code": "age = 20\nif age >= 18:\n    print(\"Adult\")\n    print(\"Eligible for voting\")\nprint(\"Program finished\")", "sample_run": "Adult\nEligible for voting\nProgram finished"}, {"name": "original example - Comments and Docstrings", "problem_logic": "Demonstrates inline/single-line comments for calculating simple interest, and a docstring inside a function.", "code": "# Calculate simple interest\nprincipal = 10000 # amount invested\nrate = 7.5\nperiod = 2\ninterest = principal * rate * period / 100\nprint(interest)\n\ndef square(n):\n    \"\"\"Return the square of n.\"\"\"\n    return n * n\n\nprint(square(6))", "sample_run": "1500.0\n36"}, {"name": "original example - Variables and Dynamic Typing", "problem_logic": "The name x can be rebound to objects of different types during execution.", "code": "x = 10\nprint(x, type(x))\nx = 3.5\nprint(x, type(x))\nx = \"Python\"\nprint(x, type(x))", "sample_run": "10 <class 'int'>\n3.5 <class 'float'>\nPython <class 'str'>"}, {"name": "original example - Valid and Invalid Identifiers", "problem_logic": "Demonstrates valid snake_case identifiers vs invalid identifiers starting with digits, containing hyphens, or using keywords.", "code": "student_name = \"Ravi\" # valid\nmarks2 = 85 # valid\n_total = 100 # valid\n# 2marks = 85 # invalid: starts with digit\n# student-name = \"Ravi\" # invalid: parsed as subtraction\n# class = \"CSE\" # invalid: keyword", "sample_run": "Variables bound without syntax errors when invalid lines are commented."}, {"name": "original example - Multiple Assignment and Swapping", "problem_logic": "Simultaneous assignment, variable swapping without a temporary variable, and chained assignment.", "code": "a, b = 10, 20\nprint(a, b)\na, b = b, a\nprint(a, b)\nx = y = z = 0\nprint(x, y, z)", "sample_run": "10 20\n20 10\n0 0 0"}, {"name": "original example - Inspecting Keywords", "problem_logic": "Use Python's built-in keyword module to list all reserved words and test whether a string is a keyword.", "code": "import keyword\nprint(keyword.kwlist)\nprint(keyword.iskeyword(\"for\"))\nprint(keyword.iskeyword(\"total\"))", "sample_run": "[...list of keywords...]\nTrue\nFalse"}], "similar_coding_questions": [{"level": 1, "title": "Three-Way Variable Swap", "question": "Given three variables a = 5, b = 10, c = 15, write a single line of Python using multiple assignment to rotate their values so that a becomes b, b becomes c, and c becomes a. Print the result."}, {"level": 2, "title": "Simple Interest with Proper Identifiers", "question": "Read principal, rate_of_interest, and time_years from the user, compute simple interest and total amount due, and include a single-line comment explaining the formula."}, {"level": 3, "title": "Keyword & Identifier Validator", "question": "Write a program that takes a candidate variable name as input and checks using the keyword module and string methods (.isidentifier()) whether it is a valid non-keyword Python identifier."}, {"level": 4, "title": "Dynamic Type Tracker", "question": "Assign an integer to a variable `data`, print its value and type, then reassign `data` to the float version of itself divided by 2, print value and type, and finally reassign it to a formatted string of that result."}], "quiz_questions": [{"question": "What happens if you omit indentation in the line immediately following `if age >= 18:`?", "options": ["Python automatically indents the code at runtime", "Python raises an IndentationError", "The program runs normally but skips the if condition", "It raises a ValueError"], "answer": "Python raises an IndentationError", "explanation": "Indentation is part of Python syntax, not just cosmetic formatting. A block after a colon must be indented."}, {"question": "Which of the following is a VALID Python identifier?", "options": ["2nd_place", "student-name", "_total_marks_2", "class"], "answer": "_total_marks_2", "explanation": "Identifiers can start with a letter or underscore and contain letters, digits, and underscores. They cannot start with a digit, contain hyphens, or be keywords like 'class'."}, {"question": "How does Python treat `total`, `Total`, and `TOTAL`?", "options": ["As the exact same variable", "As three distinct identifiers because Python is case-sensitive", "`TOTAL` is reserved as a keyword", "Only `total` is valid; uppercase letters are forbidden"], "answer": "As three distinct identifiers because Python is case-sensitive", "explanation": "Python identifiers and keywords are strictly case-sensitive."}, {"question": "What is the conventional number of spaces per indentation level in Python?", "options": ["2 spaces", "4 spaces", "8 spaces", "1 space"], "answer": "4 spaces", "explanation": "PEP 8 and standard Python guidelines specify 4 spaces per indentation level and advise against mixing tabs and spaces."}, {"question": "Which statement accurately describes docstrings in Python?", "options": ["They begin with the # symbol", "They are triple-quoted string literals used to document modules, classes, and functions", "They cause a syntax error if placed inside a function", "They can only be one line long"], "answer": "They are triple-quoted string literals used to document modules, classes, and functions", "explanation": "Docstrings use triple quotes (\"\"\"...\"\"\") to document functions, classes, and modules, whereas single-line comments use #."}, {"question": "What is the output of `a, b = 10, 20` followed by `a, b = b, a + b`?", "options": ["20 30", "20 10", "10 30", "30 20"], "answer": "20 30", "explanation": "In multiple assignment, the entire right-hand side is evaluated first using the old values (b=20, a+b=30) before binding to a and b."}]}, {"topic_id": "U2_T3", "topic_name": "Core Data Types, Mutability, Type Conversion & Input/Output", "summary": "Covers scalar types (int, float, complex, bool, NoneType) and collection types (str, list, tuple, set, dict), mutable vs. immutable objects, explicit type casting, and reading single/multiple inputs.", "original_examples": [{"name": "original example - Numeric Data Types", "problem_logic": "Demonstrates int, float, and complex numbers along with accessing real and imaginary parts.", "code": "a = 25\nb = 3.75\nc = 2 + 5j\nprint(type(a)) # int\nprint(type(b)) # float\nprint(type(c)) # complex\nprint(c.real, c.imag)", "sample_run": "<class 'int'>\n<class 'float'>\n<class 'complex'>\n2.0 5.0"}, {"name": "original example - Boolean and None", "problem_logic": "Shows bool values, NoneType, and how comparisons evaluate to Booleans.", "code": "is_valid = True\nis_empty = False\nresult = None\nprint(type(is_valid))\nprint(type(result))\nprint(10 > 5) # True\nprint(3 == 7) # False", "sample_run": "<class 'bool'>\n<class 'NoneType'>\nTrue\nFalse"}, {"name": "original example - Strings", "problem_logic": "Demonstrates indexing, negative indexing, len(), upper(), and slicing on immutable strings.", "code": "course = \"Python Programming\"\nprint(course)\nprint(course[0])\nprint(course[-1])\nprint(len(course))\nprint(course.upper())\nprint(course[0:6])", "sample_run": "Python Programming\nP\ng\n18\nPYTHON PROGRAMMING\nPython"}, {"name": "original example - Lists and Tuples", "problem_logic": "Contrasts mutable lists (using .append()) with immutable tuples.", "code": "marks = [78, 85, 91]\nmarks.append(88)\nprint(marks)\npoint = (10, 20)\nprint(point[0])\nprint(type(marks), type(point))", "sample_run": "[78, 85, 91, 88]\n10\n<class 'list'> <class 'tuple'>"}, {"name": "original example - Sets and Dictionaries", "problem_logic": "Shows automatic duplicate removal in sets and key-value mapping/iteration in dictionaries.", "code": "subjects = {\"Python\", \"Math\", \"Python\"}\nprint(subjects) # duplicate removed\n\nstudent = {\"name\": \"Anu\", \"marks\": 92}\nprint(student[\"name\"])\nprint(student[\"marks\"])\n\nfor key, value in student.items():\n    print(key, value)", "sample_run": "{'Python', 'Math'}\nAnu\n92\nname Anu\nmarks 92"}, {"name": "original example - Type Conversion & Input", "problem_logic": "Demonstrates explicit casting with int(), str(), float(), and reading multiple space-separated integers using split() and map().", "code": "x = \"25\"\ny = int(x)\nprint(y + 5) # 30\nprice = 99\ntext = str(price)\nprint(\"Price: \" + text)\nprint(float(\"7.5\"))\nprint(int(8.9))\n\nage = input(\"Enter age: \")\nprint(type(age))\nage = int(age)\nprint(\"Next year:\", age + 1)\n\na, b = map(int, input(\"Enter two integers: \").split())\nprint(\"Sum =\", a + b)", "sample_run": "30\nPrice: 99\n7.5\n8\nEnter age: 18 -> <class 'str'> -> Next year: 19\nEnter two integers: 10 20 -> Sum = 30"}], "similar_coding_questions": [{"level": 1, "title": "Celsius to Fahrenheit Converter", "question": "Read a temperature in Celsius as a float from the user, convert it to Fahrenheit using F = (C * 9/5) + 32, and print the result."}, {"level": 2, "title": "String Slicer & Analyzer", "question": "Read a sentence from the user and display its total length, its first 3 characters, its last 3 characters, and its uppercase version."}, {"level": 3, "title": "Unique Word Counter with Sets", "question": "Read a line of space-separated words from the user, split it into a list, convert it to a set to remove duplicates, and print both the total word count and unique word count."}, {"level": 4, "title": "Three-Digit Sum & Time Converter", "question": "Read two inputs on one line: a 3-digit integer and a total number of seconds. Output the sum of the digits of the 3-digit number, and convert the seconds into hours, minutes, and remaining seconds."}], "quiz_questions": [{"question": "Which of the following contains ONLY immutable data types in Python?", "options": ["list, tuple, str", "int, float, str, tuple, bool", "dict, set, int", "str, tuple, list"], "answer": "int, float, str, tuple, bool", "explanation": "int, float, bool, str, and tuple are immutable. list, dict, and set are mutable."}, {"question": "What is the return type of the `input()` function in Python?", "options": ["It automatically detects int, float, or str", "Always `str`", "Always `int` unless decimal points are typed", "`NoneType`"], "answer": "Always `str`", "explanation": "input() always returns a string (`str`), requiring explicit conversion like `int()` or `float()` for numeric math."}, {"question": "What is the output of `print(int(8.9))` and `print(int(-8.9))`?", "options": ["9 and -9", "8 and -8", "8 and -9", "Raises a ValueError"], "answer": "8 and -8", "explanation": "`int()` truncates floating-point numbers toward zero."}, {"question": "What happens when you execute `subjects = {\"Python\", \"Math\", \"Python\"}`?", "options": ["It raises a KeyError due to duplicate values", "It creates a set with two elements: `{'Python', 'Math'}`", "It creates a tuple with three elements", "It creates a dictionary mapping Python to Math"], "answer": "It creates a set with two elements: `{'Python', 'Math'}`", "explanation": "Sets store only unique elements and automatically discard duplicates."}, {"question": "For the complex number `c = 2 + 5j`, how do you access the imaginary part?", "options": ["c.imaginary()", "c.imag", "c[1]", "imag(c)"], "answer": "c.imag", "explanation": "Complex numbers have `.real` and `.imag` attributes that return float values."}]}, {"topic_id": "U2_T4", "topic_name": "Operators, Precedence, Associativity & Expressions", "summary": "Covers arithmetic (/ vs //, %, **), comparison, chained comparisons, logical (and, or, not), truthiness, compound assignment, membership (in, not in), identity (is, is not), bitwise operators, precedence rules, associativity, and conditional expressions.", "original_examples": [{"name": "original example - Arithmetic & Negative Floor Division", "problem_logic": "Contrasts true division (/) with floor division (//) and modulo (%) on positive and negative numbers.", "code": "a, b = 17, 5\nprint(a + b)  # 22\nprint(a - b)  # 12\nprint(a * b)  # 85\nprint(a / b)  # 3.4\nprint(a // b) # 3\nprint(a % b)  # 2\nprint(a ** b) # 1419857\n\nprint(7 // 3)   # 2\nprint(-7 // 3)  # -3\nprint(7 // -3)  # -3\nprint(-7 % 3)   # 2", "sample_run": "22, 12, 85, 3.4, 3, 2, 1419857 | 2, -3, -3, 2"}, {"name": "original example - Chained Comparisons & Logical Operators", "problem_logic": "Demonstrates natural chained comparisons and logical operators (and, or, not).", "code": "age = 19\nprint(18 <= age <= 60) # True\nx = 5\nprint(1 < x < 10)  # True\nprint(10 > x > 0)  # True\n\nage = 21\ncitizen = True\nprint(age >= 18 and citizen)\nprint(age < 18 or citizen)\nprint(not citizen)", "sample_run": "True\nTrue\nTrue\nTrue\nTrue\nFalse"}, {"name": "original example - Truthiness", "problem_logic": "Inspects how empty strings and empty lists evaluate to False in Boolean contexts.", "code": "name = \"\"\nif name:\n    print(\"Name supplied\")\nelse:\n    print(\"Name is empty\")\n\nitems = [1, 2]\nprint(bool(items)) # True\nprint(bool([]))    # False", "sample_run": "Name is empty\nTrue\nFalse"}, {"name": "original example - Assignment, Membership, Identity & Bitwise Operators", "problem_logic": "Demonstrates compound assignment, in/not in, object identity (is) vs equality (==), and bitwise operations.", "code": "# Assignment\nx = 10\nx += 5\nx -= 3\nx *= 2\nx //= 5\nprint(x) # 4\n\n# Membership\nword = \"python\"\nprint(\"py\" in word) # True\n\n# Identity\nx = [1, 2]\ny = x\nz = [1, 2]\nprint(x == z) # True: equal contents\nprint(x is z) # False: different objects\nprint(x is y) # True\n\n# Bitwise\na = 6 # 110\nb = 3 # 011\nprint(a & b, a | b, a ^ b, a << 1, a >> 1)", "sample_run": "4\nTrue\nTrue\nFalse\nTrue\n2 7 5 12 3"}, {"name": "original example - Operator Precedence & Associativity", "problem_logic": "Shows evaluation order and right-to-left associativity of exponentiation (**).", "code": "print(2 + 3 * 4)     # 14\nprint((2 + 3) * 4)   # 20\nprint(10 + 6 / 2 ** 2) # 11.5\nprint(20 / 5 * 2)    # 8.0\nprint(10 - 3 - 2)    # 5\nprint(2 ** 3 ** 2)   # 512\nprint((2 ** 3) ** 2) # 64", "sample_run": "14, 20, 11.5, 8.0, 5, 512, 64"}, {"name": "original example - Worked Expression (BMI) & Conditional Expression", "problem_logic": "Calculates Body Mass Index using parentheses for clarity, and shows a ternary conditional expression.", "code": "weight = 70   # kg\nheight = 1.75 # m\nbmi = weight / (height ** 2)\nprint(\"BMI =\", round(bmi, 2))\n\nage = 17\nstatus = \"Adult\" if age >= 18 else \"Minor\"\nprint(status)", "sample_run": "BMI = 22.86\nMinor"}, {"name": "original example - Debugging Exercise (Average of Two Numbers)", "problem_logic": "Fixes invalid variable name (1st), missing int() conversions, operator precedence error in average calculation, and unclosed string quote.", "code": "# Faulty Code:\n# 1st = input(\"First: \")\n# second = input(\"Second: \")\n# average = 1st + second / 2\n# print(\"Average = average)\n\n# Corrected Code:\nfirst = int(input(\"First: \"))\nsecond = int(input(\"Second: \"))\naverage = (first + second) / 2\nprint(\"Average =\", average)", "sample_run": "First: 10, Second: 20 -> Average = 15.0"}], "similar_coding_questions": [{"level": 1, "title": "Expression Step-by-Step Evaluator", "question": "Write a program to compute and print the output of: `5 + 2 * 3 ** 2`, `(5 + 2) * 3 ** 2`, `18 // 4 + 18 % 4`, and `2 ** 2 ** 3`."}, {"level": 2, "title": "Bitwise Flag Inspector", "question": "Read two integers `a` and `b`. Print their bitwise AND, OR, XOR, `a` left-shifted by 2 bits, and `b` right-shifted by 1 bit."}, {"level": 3, "title": "Identity vs Equality List Tester", "question": "Create two separate lists with identical elements `L1 = [10, 20, 30]` and `L2 = [10, 20, 30]`, and set `L3 = L1`. Print the results of `==` and `is` between all pairs, then append `40` to `L1` and print all three lists."}, {"level": 4, "title": "Circle Validator with Conditional Expression", "question": "Read a radius `r` as a float. Use a conditional expression to print `'VALID'` if `r >= 0` else `'INVALID'`, and if valid, compute area and circumference rounded to 2 decimal places."}], "quiz_questions": [{"question": "What is the output of `print(-7 // 3)` and `print(-7 % 3)` in Python?", "options": ["-2 and -1", "-3 and 2", "-2 and 2", "-3 and -1"], "answer": "-3 and 2", "explanation": "Floor division (//) rounds down toward negative infinity (-7 / 3 = -2.33 -> -3). Since (-3)*3 + 2 = -7, the remainder is 2."}, {"question": "Why does `2 ** 3 ** 2` evaluate to `512` instead of `64`?", "options": ["Because multiplication happens before addition", "Because the exponentiation operator `**` is right-associative, evaluating `3 ** 2` (9) first", "Because Python evaluates all expressions from right to left", "Because `**` converts numbers to binary"], "answer": "Because the exponentiation operator `**` is right-associative, evaluating `3 ** 2` (9) first", "explanation": "Unlike most arithmetic operators which associate left-to-right, `**` associates right-to-left: 2 ** (3 ** 2) = 2 ** 9 = 512."}, {"question": "What is the key difference between `==` and `is` in Python?", "options": ["`==` checks if two variables point to the exact same memory object; `is` checks value equality", "`==` checks value equality; `is` checks object identity (whether both refer to the exact same object in memory)", "`is` is used only for numbers, while `==` is used only for strings", "There is no difference"], "answer": "`==` checks value equality; `is` checks object identity (whether both refer to the exact same object in memory)", "explanation": "Two distinct lists with identical elements are equal (`x == z` is True) but are not the same object (`x is z` is False)."}, {"question": "What is the correct precedence order for logical operators from highest to lowest?", "options": ["and -> or -> not", "not -> and -> or", "or -> and -> not", "All three have equal precedence"], "answer": "not -> and -> or", "explanation": "`not` has the highest precedence among logical operators, followed by `and`, and finally `or`."}, {"question": "What does `print(not True or False)` output?", "options": ["True", "False", "None", "SyntaxError"], "answer": "False", "explanation": "`not True` evaluates first to `False`, and `False or False` evaluates to `False`."}, {"question": "Which of the following values is considered 'Truthy' (evaluates to `True` in `bool()`)?", "options": ["\"\"", "[]", "0.0", "[0]"], "answer": "[0]", "explanation": "`[0]` is a non-empty list (it contains one element), so it is truthy. Empty strings, empty lists, and numeric zero are falsy."}]}, {"topic_id": "U2_T5", "topic_name": "Built-in Functions, Modules & Packages", "summary": "Covers built-in utility functions (print with sep/end, min, max, sum, abs, pow, round, len, sorted, reversed, range, enumerate, zip) and importing standard library modules (math, random, statistics, datetime) using standard, selective, and alias imports.", "original_examples": [{"name": "original example - range(), enumerate(), and zip()", "problem_logic": "Demonstrates generating sequences with range(), indexing iterables with enumerate(), and pairing multiple iterables with zip().", "code": "for num in range(1, 6):\n    print(num, end=\" \")\nprint()\n\nfruits = [\"apple\", \"banana\", \"cherry\"]\nfor index, fruit in enumerate(fruits, start=1):\n    print(f\"{index}: {fruit}\")\n\ncolors = [\"red\", \"yellow\", \"pink\"]\nfor fruit, color in zip(fruits, colors):\n    print(f\"{fruit} is {color}\")\n\nprices = [100, 40, 60]\nfor idx, (fruit, price) in enumerate(zip(fruits, prices), start=1):\n    print(f\"{idx}. {fruit} costs ₹{price}\")", "sample_run": "1 2 3 4 5\n1: apple ...\napple is red ...\n1. apple costs ₹100 ..."}, {"name": "original example - print() sep/end, Numeric & Sequence Built-ins", "problem_logic": "Shows sep and end in print(), numeric aggregations (min, max, sum, abs, pow, round), and sequence ordering (len, sorted, reversed).", "code": "name = \"Asha\"\nscore = 92\nprint(\"Name:\", name, \"Score:\", score)\nprint(\"2026\", \"09\", \"20\", sep=\"-\")\nprint(\"Hello\", end=\" \")\nprint(\"Python\")\n\nvalues = [12, 5, 18, 9]\nprint(min(values), max(values), sum(values), abs(-17), pow(2, 5), round(3.1415926, 3))\n\nnames = [\"Bob\", \"Anu\", \"Alice\", \"Kiran\"]\nprint(len(names))\nprint(sorted(names))\nprint(list(reversed(names)))\nprint(sorted(names, reverse=True))", "sample_run": "Name: Asha Score: 92\n2026-09-20\nHello Python\n5 18 44 17 32 3.142\n4\n['Alice', 'Anu', 'Bob', 'Kiran']"}, {"name": "original example - Importing Modules (math, statistics, random, datetime)", "problem_logic": "Demonstrates `import math`, `from math import sqrt, pi`, alias `import math as m`, `random`, and `datetime.date`.", "code": "import math\nprint(math.sqrt(81), math.pi, math.factorial(5), math.ceil(4.2))\n\nfrom math import sqrt, pi\nradius = 4\nprint(pi * radius ** 2, sqrt(144))\n\nimport statistics as stats\nprint(stats.mean([10, 20, 30]))\n\nimport random\nprint(random.randint(1, 6))\nprint(random.choice([\"red\", \"green\", \"blue\"]))\nnumbers = [1, 2, 3, 4, 5]\nrandom.shuffle(numbers)\nprint(numbers)\n\nfrom datetime import date\ntoday = date.today()\nprint(today, today.year, today.month, today.day)", "sample_run": "9.0 3.14159... 120 5 | 50.265... 12.0 | 20 | random outputs | 2026-10-05 2026 10 5"}, {"name": "original example - Integrated Example: Student Result", "problem_logic": "Combines input, float conversion, arithmetic expressions, round(), and a conditional expression.", "code": "name = input(\"Student name: \")\nm1 = float(input(\"Mark 1: \"))\nm2 = float(input(\"Mark 2: \"))\nm3 = float(input(\"Mark 3: \"))\ntotal = m1 + m2 + m3\naverage = total / 3\nstatus = \"PASS\" if average >= 40 else \"REPEAT\"\nprint(name, total, round(average, 2), status)", "sample_run": "Student name: Alice, Marks: 98, 78, 89 -> Alice 265.0 88.33 PASS"}], "similar_coding_questions": [{"level": 1, "title": "Euclidean Distance Calculator", "question": "Read coordinates (x1, y1) and (x2, y2) from the user. Import `sqrt` from `math` and calculate the distance between the two points rounded to 2 decimal places."}, {"level": 2, "title": "Five-Subject Marks Summary", "question": "Read marks in 5 subjects as space-separated floats into a list. Using built-in functions, display the total, average, minimum, maximum, and the marks sorted in descending order."}, {"level": 3, "title": "Dice Roll & Coin Toss Simulator", "question": "Use the `random` module to simulate rolling two 6-sided dice (`randint(1, 6)`), print their individual values and sum, and use `random.choice()` to simulate a coin toss ('Heads' or 'Tails')."}, {"level": 4, "title": "Invoice Formatter with enumerate() and zip()", "question": "Given three lists: `items = ['Laptop', 'Mouse', 'Keyboard']`, `quantities = [1, 2, 1]`, and `unit_prices = [55000, 600, 1500]`, use `enumerate()` and `zip()` to print a numbered receipt showing each item's line total and the grand total using `sum()`."}], "quiz_questions": [{"question": "What is the output of `print(list(range(2, 11, 2)))`?", "options": ["[2, 4, 6, 8, 10, 12]", "[2, 4, 6, 8, 10]", "[2, 3, 4, 5, 6, 7, 8, 9, 10]", "[4, 6, 8, 10]"], "answer": "[2, 4, 6, 8, 10]", "explanation": "`range(start, stop, step)` starts at 2, increments by 2, and excludes the stop value (11)."}, {"question": "How do `import math` and `from math import sqrt` differ?", "options": ["`import math` requires calling `math.sqrt()`, whereas `from math import sqrt` allows calling `sqrt()` directly", "`from math import sqrt` imports the entire math module under an alias", "`import math` is faster at runtime than `from math import sqrt`", "There is no difference in how `sqrt` is called"], "answer": "`import math` requires calling `math.sqrt()`, whereas `from math import sqrt` allows calling `sqrt()` directly", "explanation": "Standard `import math` binds the module namespace, while `from math import sqrt` brings `sqrt` directly into the current namespace."}, {"question": "What does `math.ceil(4.2)` return?", "options": ["4", "4.0", "5", "5.0"], "answer": "5", "explanation": "`math.ceil()` rounds a number UP to the nearest integer greater than or equal to the value."}, {"question": "Which statement about `sorted(names)` is TRUE?", "options": ["It modifies the original list in-place and returns None", "It returns a new sorted list without modifying the original iterable", "It only works on tuples", "It sorts in descending order by default"], "answer": "It returns a new sorted list without modifying the original iterable", "explanation": "`sorted()` creates and returns a brand-new list and works on any iterable."}, {"question": "What is the output of `print(\"2026\", \"10\", \"22\", sep=\"/\")`?", "options": ["2026 10 22/", "2026/10/22", "2026-10-22", "/2026/10/22/"], "answer": "2026/10/22", "explanation": "The `sep` parameter specifies the string inserted between multiple arguments in `print()`."}]}], "learning_outcomes": ["Explain Python's basic features and typical uses.", "Work with Python in interactive and script modes.", "Apply indentation and comments correctly.", "Create variables and follow identifier rules.", "Recognize keywords and major built-in data types.", "Use arithmetic, relational, logical, assignment, membership, identity, and bitwise operators.", "Apply operator precedence and associativity to evaluate expressions.", "Use common built-in functions effectively.", "Import and use modules and packages.", "Trace, predict, and debug short Python programs."]}, {"unit_number": "Unit III", "unit_title": "Control Structures in Python", "topics": [{"topic_id": "U3_T1", "topic_name": "Topic 01: Decision Making & Branching (if, elif, else, nested if)", "summary": "Translating real-world multi-constraint rules into Boolean conditions, cumulative slab calculations, nested branching, fail-safe rules, and avoiding common decision pitfalls.", "original_examples": [{"name": "original example - Example 1: Scholarship eligibility", "problem_logic": "A scholarship requires: marks >= 85, attendance >= 75%, family income <= 5,00,000. In addition, a student with a national-level award is eligible even if marks are 80-84.99, provided attendance and income rules hold.", "code": "marks = float(input(\"Marks: \"))\nattendance = float(input(\"Attendance %: \"))\nincome = float(input(\"Family income: \"))\naward = input(\"National award? y/n: \").lower()\n\nbasic = marks >= 85 and attendance >= 75 and income <= 500000\nexception = (80 <= marks < 85 and award == \"y\"\n             and attendance >= 75 and income <= 500000)\n\nif basic or exception:\n    print(\"Eligible for scholarship\")\nelse:\n    print(\"Not eligible\")", "sample_run": "Marks=82, Attendance=91, Income=420000, Award=y -> Eligible for scholarship"}, {"name": "original example - Example 2: Electricity bill with slab tariff", "problem_logic": "Compute bill using cumulative slabs: first 100 units ₹1.5/unit, next 100 units ₹2.5, next 300 units ₹4, above 500 units ₹6. Add fixed charge ₹75; if bill exceeds ₹2000 add 5% surcharge.", "code": "u = int(input(\"Units: \"))\nif u <= 100:\n    energy = u * 1.5\nelif u <= 200:\n    energy = 100 * 1.5 + (u - 100) * 2.5\nelif u <= 500:\n    energy = 100 * 1.5 + 100 * 2.5 + (u - 200) * 4\nelse:\n    energy = 100 * 1.5 + 100 * 2.5 + 300 * 4 + (u - 500) * 6\n\nbill = energy + 75\nif bill > 2000:\n    bill *= 1.05\nprint(f\"Bill = ₹{bill:.2f}\")", "sample_run": "Units = 620 -> Energy ₹2320; +₹75; +5% surcharge -> ₹2514.75"}, {"name": "original example - Example 3: Loan eligibility with nested decisions", "problem_logic": "Applicant must be 21-60. If salaried: salary >= 35k and credit score >= 700. If self-employed: annual income >= 6 lakh and credit score >= 720. Otherwise reject.", "code": "age = int(input(\"Age: \"))\nkind = input(\"salaried/self: \").lower()\nscore = int(input(\"Credit score: \"))\n\nif 21 <= age <= 60:\n    if kind == \"salaried\":\n        salary = float(input(\"Monthly salary: \"))\n        ok = salary >= 35000 and score >= 700\n    elif kind == \"self\":\n        income = float(input(\"Annual income: \"))\n        ok = income >= 600000 and score >= 720\n    else:\n        ok = False\n    print(\"Eligible\" if ok else \"Not eligible\")\nelse:\n    print(\"Rejected: age criterion\")", "sample_run": "Age=42, self, score=735, income=850000 -> Eligible"}, {"name": "original example - Example 4: Student grade with fail-safe rule", "problem_logic": "Overall grade is based on average, but a student fails if any subject mark is below 35. Otherwise: A >= 85, B >= 70, C >= 55, D >= 40, else E.", "code": "m = [int(input(f\"Subject {i}: \")) for i in range(1, 6)]\navg = sum(m) / len(m)\n\nif min(m) < 35:\n    grade = \"F (failed in a subject)\"\nelif avg >= 85:\n    grade = \"A\"\nelif avg >= 70:\n    grade = \"B\"\nelif avg >= 55:\n    grade = \"C\"\nelif avg >= 40:\n    grade = \"D\"\nelse:\n    grade = \"E\"\n\nprint(f\"Average={avg:.1f}, Grade={grade}\")", "sample_run": "Marks: 92, 88, 76, 34, 90 -> Average=76.0 but Grade=F (failed in a subject)"}, {"name": "original example - Example 5: Triangle validator & classifier", "problem_logic": "Given three sides: first verify that all sides are positive and satisfy triangle inequality. Then classify as equilateral, isosceles or scalene.", "code": "a, b, c = map(float, input(\"Enter 3 sides: \").split())\nif a <= 0 or b <= 0 or c <= 0:\n    print(\"Invalid sides\")\nelif a + b <= c or a + c <= b or b + c <= a:\n    print(\"Not a triangle\")\nelse:\n    if a == b == c:\n        kind = \"Equilateral\"\n    elif a == b or b == c or a == c:\n        kind = \"Isosceles\"\n    else:\n        kind = \"Scalene\"\n    print(\"Valid\", kind, \"triangle\")", "sample_run": "Input: 7 7 10 -> Valid Isosceles triangle"}, {"name": "original example - Example 6: Parking fee engine", "problem_logic": "Fee depends on vehicle and hours. Car: ₹40 first 2 h + ₹20/h thereafter (cap ₹300). Bike: ₹20 first 2 h + ₹10/h thereafter (cap ₹150). Lost ticket adds ₹200.", "code": "vehicle = input(\"car/bike: \").lower()\nh = int(input(\"Hours: \"))\nlost = input(\"Lost ticket? y/n: \").lower() == \"y\"\n\nif vehicle == \"car\":\n    fee = 40 if h <= 2 else 40 + (h - 2) * 20\n    fee = min(fee, 300)\nelif vehicle == \"bike\":\n    fee = 20 if h <= 2 else 20 + (h - 2) * 10\n    fee = min(fee, 150)\nelse:\n    fee = 0\n\nif lost:\n    fee += 200\nprint(\"Fee = ₹\", fee)", "sample_run": "car, 18 hours, lost ticket -> min(₹360, ₹300) + ₹200 = ₹500"}], "similar_coding_questions": [{"level": 1, "title": "Railway Ticket Fare with Age Concessions", "question": "Read base fare, passenger age, and class ('sleeper' or 'ac'). Apply a 50% discount for children under 12 and a 40% discount for seniors (age >= 60). If class is 'ac', add a 20% surcharge on the discounted fare."}, {"level": 2, "title": "Progressive Income Tax Calculator", "question": "Compute income tax using cumulative slabs: up to ₹3,00,000: 0%; ₹3,00,001 to ₹6,00,000: 5%; ₹6,00,001 to ₹9,00,000: 10%; above ₹9,00,000: 15%. If total income is <= ₹7,00,000, apply a full tax rebate (tax becomes ₹0). Add 4% health & education cess on final tax."}, {"level": 3, "title": "Date & Leap-Year Validator", "question": "Read day, month, and year as integers. Validate whether the date is a real calendar date, properly accounting for months with 30 vs 31 days and February in leap years (divisible by 400, or divisible by 4 and not 100)."}, {"level": 4, "title": "Cab Fare Calculator (Design Challenge)", "question": "Inputs: distance (km), waiting minutes, time-of-day ('day'/'night'). Base fare ₹60 covers first 2 km; next 8 km at ₹14/km; beyond 10 km at ₹18/km. Waiting charge is ₹2/min after the first 5 minutes. Night surcharge is 20% on travel fare only (not waiting charge). Reject negative inputs and print an itemized bill."}, {"level": 5, "title": "Student Distinction & Grace Marks Engine", "question": "Read 5 subject marks. If a student fails in exactly one subject with marks between 30 and 34, award grace marks to bring that subject to 35 and pass them. Otherwise, any mark < 35 is a Fail. If passed without grace and all marks >= 75 with average >= 85, award 'Distinction'."}], "quiz_questions": [{"question": "Consider the faulty code:\n`mark = int(input())`\n`if mark >= 90: print('A')`\n`if mark >= 75: print('B')`\n`else: print('C')`\nWhat happens if `mark` is 95?", "options": ["Only 'A' is printed", "Both 'A' and 'B' are printed because the second `if` is independent of the first `if`", "Only 'B' is printed", "'A' and 'C' are printed"], "answer": "Both 'A' and 'B' are printed because the second `if` is independent of the first `if`", "explanation": "Using two separate `if` statements instead of `if-elif` causes both conditions to be tested independently. Since 95 >= 90 and 95 >= 75, both print."}, {"question": "In the same code snippet above, which `if` statement owns the `else:` block?", "options": ["The first `if` (`mark >= 90`)", "The second `if` (`mark >= 75`)", "Both `if` statements share the `else`", "Neither; it raises a SyntaxError"], "answer": "The second `if` (`mark >= 75`)", "explanation": "An `else` always pairs with the nearest preceding `if` at the same indentation level."}, {"question": "Why is checking a broad condition (e.g., `if avg >= 40:`) BEFORE a specific condition (e.g., `elif avg >= 85:`) a decision-making pitfall?", "options": ["Python does not allow numbers larger than 40 in `if` statements", "The broad condition captures values like 90 first, making the subsequent `elif avg >= 85:` unreachable dead code", "It causes an infinite loop", "It raises a TypeError"], "answer": "The broad condition captures values like 90 first, making the subsequent `elif avg >= 85:` unreachable dead code", "explanation": "In an `if-elif-else` ladder, the first branch that evaluates to True executes and all remaining `elif` branches are skipped."}, {"question": "Which geometric condition must three positive sides `a, b, c` satisfy to form a valid triangle?", "options": ["`a + b == c`", "`a + b > c and a + c > b and b + c > a`", "`a == b or b == c`", "`a**2 + b**2 == c**2`"], "answer": "`a + b > c and a + c > b and b + c > a`", "explanation": "By the triangle inequality theorem, the sum of the lengths of any two sides must be strictly greater than the third side."}, {"question": "Why should you avoid comparing floating-point numbers directly with `==` (e.g., `0.1 + 0.2 == 0.3`)?", "options": ["`==` only works on strings", "Binary floating-point representation can introduce tiny precision rounding errors, so checking `abs(a - b) < tolerance` is safer", "Python raises a ZeroDivisionError", "Floats cannot be compared in Python"], "answer": "Binary floating-point representation can introduce tiny precision rounding errors, so checking `abs(a - b) < tolerance` is safer", "explanation": "Due to IEEE 754 floating-point representation, `0.1 + 0.2` is `0.30000000000000004`, so tolerance-based comparison is recommended."}]}, {"topic_id": "U3_T2", "topic_name": "Topic 02: Looping with while (Condition, Sentinel & Convergence)", "summary": "Condition-controlled repetition, input validation loops, digit extraction analytics, sentinel-based interactive processing, Euclid's GCD algorithm, and Newton-Raphson numerical convergence.", "original_examples": [{"name": "original example - Example 7: Robust input validation", "problem_logic": "Accept a percentage only in [0,100]. Keep asking until valid. Count invalid attempts.", "code": "attempts = 0\nwhile True:\n    p = float(input(\"Percentage [0..100]: \"))\n    if 0 <= p <= 100:\n        break\n    attempts += 1\n    print(\"Invalid. Try again.\")\n\nprint(\"Accepted:\", p)\nprint(\"Invalid attempts:\", attempts)", "sample_run": "Inputs: -5, 108, 86 -> Accepted 86 after 2 invalid attempts"}, {"name": "original example - Example 8: Digit analytics", "problem_logic": "For a positive integer, find number of digits, sum of digits, product of non-zero digits, and largest digit using one while loop.", "code": "n = int(input(\"Number: \"))\nt = abs(n)\ncount = total = 0\nprod = 1\nmax_digit = 0\n\nwhile t > 0:\n    d = t % 10\n    count += 1\n    total += d\n    if d != 0:\n        prod *= d\n    if d > max_digit:\n        max_digit = d\n    t //= 10\n\nprint(count, total, prod, max_digit)", "sample_run": "Input 50724 -> digits=5, sum=18, non-zero product=280, max=7"}, {"name": "original example - Example 9: ATM withdrawal simulation", "problem_logic": "Start with a balance. Repeatedly accept withdrawals until 0 is entered. Reject invalid/overdraft requests and count successful transactions.", "code": "balance = 10000\ncount = 0\nwhile True:\n    amt = int(input(\"Withdraw (0=exit): \"))\n    if amt == 0:\n        break\n    if amt < 0 or amt % 100 != 0:\n        print(\"Invalid denomination\")\n        continue\n    if amt > balance:\n        print(\"Insufficient balance\")\n        continue\n    balance -= amt\n    count += 1\n\nprint(\"Balance:\", balance)\nprint(\"Transactions:\", count)", "sample_run": "Requests 1500, 12000, 2500, 0 -> final balance ₹6000; 2 successful"}, {"name": "original example - Example 10: GCD by Euclid's algorithm", "problem_logic": "Repeatedly replace (a,b) by (b, a%b) until b becomes zero. Also compute LCM.", "code": "a = int(input(\"a: \"))\nb = int(input(\"b: \"))\nx, y = abs(a), abs(b)\n\nwhile y != 0:\n    x, y = y, x % y\n\nprint(\"GCD =\", x)\nif a and b:\n    print(\"LCM =\", abs(a * b) // x)", "sample_run": "a=252, b=105 -> GCD=21, LCM=1260"}, {"name": "original example - Example 11: Newton iteration for square root", "problem_logic": "Approximate sqrt(N) using x_(k+1) = 0.5 * (x_k + N/x_k). Stop when consecutive estimates differ by less than 10^-6.", "code": "N = float(input(\"N: \"))\nx = N if N >= 1 else 1.0\ntol = 1e-6\niterations = 0\n\nwhile True:\n    new_x = 0.5 * (x + N / x)\n    iterations += 1\n    if abs(new_x - x) < tol:\n        x = new_x\n        break\n    x = new_x\n\nprint(f\"sqrt ≈ {x:.6f}\")\nprint(\"iterations =\", iterations)", "sample_run": "N = 10 -> sqrt ≈ 3.162278 in only a few iterations"}], "similar_coding_questions": [{"level": 1, "title": "Palindrome & Reverse Number Checker", "question": "Read a positive integer `n`. Using a `while` loop and `% 10` / `// 10` operations (without converting to a string), construct its reversed number and print whether `n` is a palindrome."}, {"level": 2, "title": "Collatz Conjecture Sequence", "question": "Read a positive integer `n`. While `n != 1`, if `n` is even replace it with `n // 2`, otherwise replace it with `3 * n + 1`. Print each value in the sequence and the total number of steps taken to reach 1."}, {"level": 3, "title": "Prime Factorization by Repeated Division", "question": "Read an integer `n >= 2`. Use a `while` loop starting with divisor `d = 2` to print all prime factors of `n` (including multiplicity, e.g., 60 -> 2, 2, 3, 5) by dividing `n` by `d` as long as `n % d == 0`, then incrementing `d`."}, {"level": 4, "title": "Mini Election Counter (Design Challenge)", "question": "Candidates are 'A', 'B', and 'C'. Repeatedly read votes until sentinel 'X' is entered. Reject and count invalid entries separately. At the end, print each candidate's vote percentage out of valid votes and declare the winner or report a tie if the highest vote is shared."}, {"level": 5, "title": "Newton's Method for Cube Root", "question": "Adapt Newton's iteration to compute the cube root of a positive number `N` by solving `x^3 - N = 0` using the update formula `new_x = (2 * x + N / (x ** 2)) / 3` until `abs(new_x - x) < 1e-6`."}], "quiz_questions": [{"question": "When is a `while` loop preferred over a `for` loop?", "options": ["When iterating over a fixed list of student names", "When the exact number of repetitions is unknown in advance and depends on a sentinel or convergence condition", "When generating a 10x10 multiplication grid", "When unpacking tuples from `enumerate()`"], "answer": "When the exact number of repetitions is unknown in advance and depends on a sentinel or convergence condition", "explanation": "`while` loops excel at condition-controlled repetition, sentinel loops, and numerical convergence where iteration count isn't known upfront."}, {"question": "In digit extraction (`while t > 0:`), what do `t % 10` and `t //= 10` accomplish?", "options": ["`t % 10` removes the last digit; `t //= 10` extracts the first digit", "`t % 10` extracts the rightmost digit; `t //= 10` strips the rightmost digit from `t`", "Both divide the number by 100", "They convert the integer to binary"], "answer": "`t % 10` extracts the rightmost digit; `t //= 10` strips the rightmost digit from `t`", "explanation": "Modulo 10 gives the units digit, and floor division by 10 shifts the remaining digits right."}, {"question": "What happens in Example 8 (Digit Analytics) if the user inputs `0`?", "options": ["The `while t > 0:` body never executes, reporting `count = 0`", "It enters an infinite loop", "It raises a ZeroDivisionError", "It outputs `count = 1`"], "answer": "The `while t > 0:` body never executes, reporting `count = 0`", "explanation": "When `n = 0`, `t > 0` is immediately False, so the loop is skipped entirely unless `0` is handled as a special case."}, {"question": "What is a 'sentinel value' in a loop?", "options": ["A syntax error that crashes the program", "A special signal value (such as 0 or 'X') entered by the user to indicate the end of input", "The maximum value in a list", "A counter variable that increments by 1"], "answer": "A special signal value (such as 0 or 'X') entered by the user to indicate the end of input", "explanation": "Sentinel-controlled loops process dynamic input until a designated stop signal is encountered."}, {"question": "In Euclid's algorithm (`while y != 0: x, y = y, x % y`), where is the GCD stored when the loop terminates?", "options": ["In `y`", "In `x`", "In `x + y`", "In `x * y`"], "answer": "In `x`", "explanation": "The loop stops when the remainder `y` becomes `0`, leaving the last non-zero divisor in `x`."}]}, {"topic_id": "U3_T3", "topic_name": "Topic 03: Looping with for (Ranges, Collections & Nested Loops)", "summary": "Collection-oriented iteration over strings, lists, and ranges, using enumerate() and zip(), primality testing, interval primes, sales analytics, character frequency analysis, 2D matrix row/column sums, and nested number patterns.", "original_examples": [{"name": "original example - Example 12: Prime number test", "problem_logic": "Test divisors only up to sqrt(n). Use for-else: else executes only if no divisor causes break.", "code": "n = int(input(\"n: \"))\nif n < 2:\n    print(\"Not prime\")\nelse:\n    limit = int(n ** 0.5)\n    for d in range(2, limit + 1):\n        if n % d == 0:\n            print(\"Composite; factor =\", d)\n            break\n    else:\n        print(\"Prime\")", "sample_run": "n = 97 -> no divisor 2..9 -> Prime"}, {"name": "original example - Example 13: Prime numbers in an interval", "problem_logic": "Print primes from L to R using nested control structures. Count how many primes were found.", "code": "L, R = map(int, input(\"L R: \").split())\ncount = 0\nfor n in range(max(2, L), R + 1):\n    for d in range(2, int(n ** 0.5) + 1):\n        if n % d == 0:\n            break\n    else:\n        print(n, end=\" \")\n        count += 1\nprint(\"\\nCount =\", count)", "sample_run": "L=20, R=50 -> 23 29 31 37 41 43 47; Count=7"}, {"name": "original example - Example 14: Sales analytics", "problem_logic": "Given daily sales, find total, average, highest sale and its day without using max().", "code": "sales = [12500, 9800, 15100, 15100, 8700, 13200, 11000]\ntotal = 0\nbest = sales[0]\nbest_day = 1\n\nfor day, value in enumerate(sales, start=1):\n    total += value\n    if value > best:\n        best = value\n        best_day = day\n\navg = total / len(sales)\nprint(\"Total\", total, \"Average\", round(avg, 2))\nprint(\"First best day\", best_day, \"Sale\", best)", "sample_run": "Total = 85400; Average ≈ 12200.0; first maximum occurs on Day 3 (Sale 15100)"}, {"name": "original example - Example 15: Character frequency analysis", "problem_logic": "Count vowels, consonants, digits, spaces and other symbols in a line of text.", "code": "text = input(\"Text: \")\nv = c = d = s = o = 0\n\nfor ch in text:\n    if ch.lower() in \"aeiou\":\n        v += 1\n    elif ch.isalpha():\n        c += 1\n    elif ch.isdigit():\n        d += 1\n    elif ch.isspace():\n        s += 1\n    else:\n        o += 1\n\nprint(\"vowels\", v, \"consonants\", c)\nprint(\"digits\", d, \"spaces\", s, \"others\", o)", "sample_run": "Input: Python 3.14! -> vowels 1 consonants 5 digits 3 spaces 1 others 2"}, {"name": "original example - Example 16: Matrix row/column totals", "problem_logic": "Use nested loops to compute row sums and column sums of a matrix.", "code": "A = [[3, 5, 2], [7, 1, 4], [6, 8, 9], [1, 2, 3]]\nrows = len(A)\ncols = len(A[0])\nrow_sum = [0] * rows\ncol_sum = [0] * cols\n\nfor i in range(rows):\n    for j in range(cols):\n        row_sum[i] += A[i][j]\n        col_sum[j] += A[i][j]\n\nprint(\"Rows:\", row_sum)\nprint(\"Columns:\", col_sum)", "sample_run": "Rows: [10, 12, 23, 6] | Columns: [17, 16, 18]"}, {"name": "original example - Example 17: Multiplication table grid", "problem_logic": "Generate a formatted 1-10 multiplication table using nested loops.", "code": "print(\"   \", end=\"\")\nfor c in range(1, 11):\n    print(f\"{c:4}\", end=\"\")\nprint()\n\nfor r in range(1, 11):\n    print(f\"{r:3}\", end=\"\")\n    for c in range(1, 11):\n        print(f\"{r * c:4}\", end=\"\")\n    print()", "sample_run": "10x10 formatted multiplication table grid."}, {"name": "original example - Example 18: Number pattern with logic", "problem_logic": "For n rows, print a centered pyramid of consecutive odd numbers.", "code": "n = 5\nvalue = 1\nfor row in range(1, n + 1):\n    print(\"  \" * (n - row), end=\"\")\n    for k in range(row):\n        print(f\"{value:3}\", end=\" \")\n        value += 2\n    print()", "sample_run": "Rows contain 1, 2, 3, 4, 5 consecutive odd numbers respectively."}], "similar_coding_questions": [{"level": 1, "title": "Second Largest Element without Built-ins", "question": "Given a list of integers, use a single `for` loop (without `max()` or `sorted()`) to find both the largest and second-largest distinct values."}, {"level": 2, "title": "Digit Frequency Table", "question": "Read a large positive integer as a string or int, and use a `for` loop to count and display the frequency of each digit from 0 to 9."}, {"level": 3, "title": "Floyd's Triangle & Alternating Binary Pyramid", "question": "Read `n`. Print two patterns of `n` rows using nested `for` loops: (a) Floyd's triangle of consecutive integers 1, 2, 3..., and (b) a right triangle where element `(i, j)` is `1` if `(i + j)` is even and `0` if odd."}, {"level": 4, "title": "Matrix Transpose & Diagonal Sums", "question": "Given a square matrix `A` of size `N x N`, use nested `for` loops to compute the sum of the main diagonal, the sum of the secondary diagonal, and build the transposed matrix `T`."}, {"level": 5, "title": "Matrix Saddle-Point Search", "question": "Given a 2D matrix `A`, use nested loops to find all 'saddle points'—elements that are simultaneously the minimum value in their row and the maximum value in their column. Print their coordinates and value, or 'No saddle point'."}], "quiz_questions": [{"question": "Why is it sufficient to test divisors only up to `int(n ** 0.5)` when checking if `n` is prime?", "options": ["Because numbers larger than `sqrt(n)` cannot be integers", "Because if `n` has a factor greater than `sqrt(n)`, it must also have a corresponding cofactor less than or equal to `sqrt(n)`", "Because `range()` cannot exceed `sqrt(n)`", "Because all even numbers are smaller than `sqrt(n)`"], "answer": "Because if `n` has a factor greater than `sqrt(n)`, it must also have a corresponding cofactor less than or equal to `sqrt(n)`", "explanation": "Any composite number `n = a * b` must have `min(a, b) <= sqrt(n)`."}, {"question": "In Example 14 (Sales Analytics), why does `if value > best:` record Day 3 instead of Day 4 when both have the highest sale of 15100?", "options": ["Because `enumerate` stops after Day 3", "Because strict inequality `>` updates `best` only when a strictly larger value is seen, preserving the first occurrence of the maximum", "Because lists are 0-indexed", "Because `>=` is a syntax error"], "answer": "Because strict inequality `>` updates `best` only when a strictly larger value is seen, preserving the first occurrence of the maximum", "explanation": "Using `>` keeps the first tie, whereas `>=` would overwrite `best_day` with the last tie."}, {"question": "Trace this code (Tracing Challenge 1):\n`count = 0`\n`for i in range(1, 5):`\n`    for j in range(i):`\n`        if (i + j) % 2 == 0: count += 1`\n`print(count)`\nWhat is printed?", "options": ["4", "5", "6", "10"], "answer": "4", "explanation": "For i=1 (j=0: 1+0=1); i=2 (j=0: 2 [even], j=1: 3); i=3 (j=0: 3, j=1: 4 [even], j=2: 5); i=4 (j=0: 4 [even], j=1: 5, j=2: 6 [even], j=3: 7). Total even sums = 4."}, {"question": "In Example 15 (Character Frequency), why must `if ch.lower() in 'aeiou':` be checked BEFORE `elif ch.isalpha():`?", "options": ["Because vowels are also alphabetic characters; checking `isalpha()` first would count vowels as consonants", "Because `.isalpha()` raises an error on vowels", "Because `.lower()` modifies the original string in place", "The order does not matter"], "answer": "Because vowels are also alphabetic characters; checking `isalpha()` first would count vowels as consonants", "explanation": "Since every vowel is an alphabetic character, `ch.isalpha()` is a broader condition and must come after the specific vowel check."}, {"question": "For a 2D list `A = [[3, 5, 2], [7, 1, 4], [6, 8, 9], [1, 2, 3]]`, what are `len(A)` and `len(A[0])`?", "options": ["3 and 4", "4 and 3", "12 and 3", "4 and 4"], "answer": "4 and 3", "explanation": "`len(A)` gives the number of rows (4), and `len(A[0])` gives the number of columns in the first row (3)."}]}, {"topic_id": "U3_T4", "topic_name": "Module 04: break, continue, pass & Loop else", "summary": "Fine-grained control over loop execution: immediate termination (break), skipping current iteration (continue), syntactic null placeholder (pass), and completion clauses (for-else / while-else).", "original_examples": [{"name": "original example - Example 19: Search with break and for-else", "problem_logic": "Search a list of transaction IDs. If found, stop immediately; otherwise execute the loop's else clause.", "code": "transactions = [1042, 1077, 1091, 1108, 1130]\ntarget = int(input(\"Transaction ID: \"))\n\nfor pos, tid in enumerate(transactions):\n    if tid == target:\n        print(\"Found at index\", pos)\n        break\nelse:\n    print(\"Transaction not found\")", "sample_run": "Target 1108 -> Found at index 3. Target 1200 -> Transaction not found."}, {"name": "original example - Example 20: Data cleaning with continue", "problem_logic": "Process sensor readings. Skip None, negative values and readings above 100. Compute average of only valid values.", "code": "readings = [42, None, -3, 55, 120, 61, 0, 48]\ntotal = count = 0\n\nfor x in readings:\n    if x is None or x < 0 or x > 100:\n        continue\n    total += x\n    count += 1\n\nprint(\"Valid count =\", count)\nprint(\"Average =\", total / count if count else \"N/A\")", "sample_run": "Valid values: 42, 55, 61, 0, 48 -> Valid count = 5, Average = 41.2"}, {"name": "original example - Example 21: Authentication attempts: while-else", "problem_logic": "Allow 3 attempts. break on success. If all attempts fail, while-else locks the account.", "code": "PIN = \"4826\"\nattempts = 3\n\nwhile attempts > 0:\n    entered = input(\"PIN: \")\n    if entered == PIN:\n        print(\"Access granted\")\n        break\n    attempts -= 1\n    print(\"Wrong PIN; left:\", attempts)\nelse:\n    print(\"Account locked\")", "sample_run": "Correct PIN on attempt 2 -> Access granted (else skipped). Three failures -> Account locked."}, {"name": "original example - Example 22: pass as a design placeholder", "problem_logic": "During incremental development, reserve a branch for a feature not implemented yet.", "code": "role = input(\"Role: \").lower()\nif role == \"admin\":\n    print(\"Admin dashboard\")\nelif role == \"faculty\":\n    pass # feature to be implemented later\nelif role == \"student\":\n    print(\"Student dashboard\")\nelse:\n    print(\"Unknown role\")\nprint(\"Login flow continues\")", "sample_run": "Role: faculty -> Login flow continues (pass performs no action)."}], "similar_coding_questions": [{"level": 1, "title": "Skip Multiples of 3 and 5", "question": "Print numbers from 1 to 30 separated by spaces, using `continue` to skip any number divisible by 3 or 5."}, {"level": 2, "title": "First Negative Transaction Detector", "question": "Given a list of daily profit/loss figures, scan the list using `for-else`. If a negative figure is found, print its day number and value and `break`. If no negative figure exists, use the loop `else` to print 'All days profitable!'."}, {"level": 3, "title": "Log Parser with pass and continue", "question": "Iterate over a list of log strings. If a line starts with `'#'` (comment) or is empty, skip it with `continue`. If it starts with `'DEBUG'`, use `pass` as a placeholder. If it starts with `'CRITICAL'`, print an alert and `break`. Count all `'INFO'` and `'ERROR'` logs processed."}, {"level": 4, "title": "Number Guessing with Strategy (Design Challenge)", "question": "Secret number is in 1..100. User gets at most 7 valid attempts. Reject guesses outside 1..100 or repeated guesses (track seen guesses in a list/set) using `continue` without consuming an attempt. Print 'Too high' / 'Too low' after each valid guess, `break` on win, and use `while-else` to report failure after 7 attempts."}], "quiz_questions": [{"question": "When does the `else:` block attached to a `for` or `while` loop execute?", "options": ["Every time an iteration is skipped with `continue`", "Only when the loop terminates via a `break` statement", "Only when the loop finishes normally (exhausts the iterable or the `while` condition becomes False) WITHOUT hitting a `break`", "Only if the loop body never executes even once"], "answer": "Only when the loop finishes normally (exhausts the iterable or the `while` condition becomes False) WITHOUT hitting a `break`", "explanation": "A loop's `else` clause runs upon normal completion and is skipped if the loop exits early via `break`."}, {"question": "Trace this code (Tracing Challenge 2):\n`for n in range(10, 16):`\n`    for d in range(2, n):`\n`        if n % d == 0:`\n`            break`\n`    else:`\n`        print(n)`\nWhich values are printed?", "options": ["10, 12, 14, 15", "11 and 13", "11, 13, 15", "Nothing is printed"], "answer": "11 and 13", "explanation": "The inner loop checks if `n` has any divisor between 2 and `n-1`. Only primes (11 and 13) complete the inner loop without `break`, triggering the `else` print."}, {"question": "What is the difference between `continue` and `pass` inside a loop?", "options": ["`continue` exits the loop completely; `pass` restarts the loop", "`continue` skips the rest of the current iteration and jumps to the next cycle; `pass` is a null operation that does nothing and lets execution proceed to the next line", "`pass` skips the current iteration; `continue` is a syntactic placeholder", "They are completely interchangeable"], "answer": "`continue` skips the rest of the current iteration and jumps to the next cycle; `pass` is a null operation that does nothing and lets execution proceed to the next line", "explanation": "`pass` is a no-op placeholder, whereas `continue` alters control flow by jumping to the next iteration."}, {"question": "In Example 20 (`if x is None or x < 0 or x > 100:`), why must `x is None` be placed BEFORE `x < 0`?", "options": ["Because `or` short-circuits; if `x` is `None`, `x is None` is True and Python skips evaluating `None < 0` which would otherwise raise a TypeError", "Because `None` is a negative number", "Because `is` has lower precedence than `or`", "Order does not matter in Python `or` expressions"], "answer": "Because `or` short-circuits; if `x` is `None`, `x is None` is True and Python skips evaluating `None < 0` which would otherwise raise a TypeError", "explanation": "Short-circuit evaluation stops as soon as the first operand of `or` is True, guarding `x < 0` from running when `x` is `None`."}, {"question": "In nested loops, which loop does a `break` statement terminate?", "options": ["All loops in the entire program", "Only the outermost loop", "Only the nearest enclosing loop in which the `break` appears", "It terminates the function"], "answer": "Only the nearest enclosing loop in which the `break` appears", "explanation": "`break` exits only the innermost loop directly enclosing it."}]}, {"topic_id": "U3_T5", "topic_name": "Section 05: Comprehensive Control Flow Integration", "summary": "Combining multi-way decisions, outer/inner loops, defensive input validation, and transfer statements into end-to-end applications: banking menus, exam processors, Armstrong/Perfect numbers, inventory reordering, and password validators.", "original_examples": [{"name": "original example - Example 23: Menu-driven banking system", "problem_logic": "Maintain balance until user exits. Deposit and withdrawal include validation; invalid menu choices continue the loop.", "code": "balance = 5000.0\nwhile True:\n    print(\"1.Deposit 2.Withdraw 3.Balance 4.Exit\")\n    ch = input(\"Choice: \")\n    if ch == \"1\":\n        amt = float(input(\"Amount: \"))\n        if amt <= 0:\n            print(\"Invalid amount\")\n            continue\n        balance += amt\n    elif ch == \"2\":\n        amt = float(input(\"Amount: \"))\n        if amt <= 0 or amt > balance:\n            print(\"Invalid withdrawal\")\n            continue\n        balance -= amt\n    elif ch == \"3\":\n        print(\"Balance =\", balance)\n    elif ch == \"4\":\n        break\n    else:\n        print(\"Invalid choice\")", "sample_run": "Combines while True, multi-way selection, validation, continue and break."}, {"name": "original example - Example 24: Exam result processor", "problem_logic": "Read marks for N students. Reject marks outside 0-100. Count pass/fail, class average and topper. Pass mark = 40.", "code": "n = int(input(\"Students: \"))\ntotal = passed = 0\ntop = -1\ntopper = \"\"\n\nfor _ in range(n):\n    name = input(\"Name: \")\n    while True:\n        mark = float(input(\"Mark: \"))\n        if 0 <= mark <= 100:\n            break\n        print(\"Re-enter valid mark\")\n    total += mark\n    if mark >= 40:\n        passed += 1\n    if mark > top:\n        top = mark\n        topper = name\n\nprint(\"Average\", total / n)\nprint(\"Pass\", passed, \"Fail\", n - passed)\nprint(\"Topper\", topper, top)", "sample_run": "Integrates outer for loop + inner validation while loop + if decisions + aggregation."}, {"name": "original example - Example 25: Armstrong numbers in a range", "problem_logic": "Find all Armstrong numbers from L to R. For each number, sum each digit raised to the number of digits.", "code": "L, R = map(int, input(\"L R: \").split())\nfor n in range(max(0, L), R + 1):\n    digits = len(str(n))\n    t = n\n    total = 0\n    if n == 0:\n        total = 0\n    while t > 0:\n        d = t % 10\n        total += d ** digits\n        t //= 10\n    if total == n:\n        print(n, end=\" \")", "sample_run": "1..1000 -> 1 2 3 4 5 6 7 8 9 153 370 371 407"}, {"name": "original example - Example 26: Perfect-number checker", "problem_logic": "A number is perfect if the sum of its proper divisors equals the number. Search divisors only up to n//2.", "code": "n = int(input(\"n: \"))\nif n <= 1:\n    print(\"Not perfect\")\nelse:\n    total = 1\n    divisors = [1]\n    for d in range(2, n // 2 + 1):\n        if n % d == 0:\n            total += d\n            divisors.append(d)\n    print(\"Divisors:\", divisors)\n    print(\"Perfect\" if total == n else \"Not perfect\")", "sample_run": "n = 28 -> proper divisors [1, 2, 4, 7, 14] -> sum = 28 -> Perfect"}, {"name": "original example - Example 27: Inventory reorder report", "problem_logic": "Each item has name, stock, reorder level and unit price. Print only items below reorder level and estimate replenishment cost to reach twice the reorder level.", "code": "items = [(\"SSD\", 4, 10, 4200), (\"RAM\", 18, 12, 2600),\n         (\"Mouse\", 6, 20, 450), (\"Keyboard\", 25, 15, 900)]\ntotal_cost = 0\n\nfor name, stock, reorder, price in items:\n    if stock >= reorder:\n        continue\n    target = 2 * reorder\n    qty = target - stock\n    cost = qty * price\n    total_cost += cost\n    print(name, \"order\", qty, \"cost\", cost)\n\nprint(\"Total reorder cost ₹\", total_cost)", "sample_run": "SSD order 16 cost 67200 | Mouse order 34 cost 15300 | Total reorder cost ₹ 82500"}, {"name": "original example - Example 28: Password policy validator", "problem_logic": "Password must be >= 8 chars and contain uppercase, lowercase, digit and special character. Scan once and stop early when all criteria are met.", "code": "pwd = input(\"Password: \")\nupper = lower = digit = special = False\n\nfor ch in pwd:\n    if ch.isupper():\n        upper = True\n    elif ch.islower():\n        lower = True\n    elif ch.isdigit():\n        digit = True\n    else:\n        special = True\n    if upper and lower and digit and special:\n        break\n\nvalid = len(pwd) >= 8 and upper and lower and digit and special\nprint(\"Strong\" if valid else \"Weak\")", "sample_run": "Abc@2026 -> length 8 and all four character classes -> Strong"}], "similar_coding_questions": [{"level": 1, "title": "Strong Number Checker (Factorials of Digits)", "question": "Read a positive integer `n`. Check if it is a Strong number (where the sum of the factorials of its digits equals `n`, e.g., `145 = 1! + 4! + 5! = 1 + 24 + 120 = 145`) using a `while` loop for digits and a `for` loop (or `math.factorial`) for each factorial."}, {"level": 2, "title": "Abundant, Deficient & Perfect Number Classifier in a Range", "question": "Read a range `L` to `R`. For every integer `n` in `[L, R]`, calculate the sum of its proper divisors and count how many numbers in the interval are Perfect (`sum == n`), Abundant (`sum > n`), and Deficient (`sum < n`)."}, {"level": 3, "title": "Bank Transaction Processor with Minimum-Balance Penalty", "question": "Start with an initial balance of ₹5,000 and a minimum required balance of ₹2,000. Process a sequence of deposits and withdrawals in a menu loop. If a valid withdrawal drops the balance below ₹2,000, levy a ₹150 minimum-balance penalty (provided balance covers it) and increment a penalty counter."}, {"level": 4, "title": "Multi-User Password Batch Auditor", "question": "Given a list of `(username, password)` tuples, validate each password against 5 rules: length >= 8, contains uppercase, lowercase, digit, and no spaces. Print a report of weak vs strong accounts and skip usernames matching `'guest'` using `continue`."}], "quiz_questions": [{"question": "In Example 24 (Exam Result Processor), why is `top` initialized to `-1` before the loop?", "options": ["Because marks are negative", "Because valid marks are in `[0, 100]`, so any valid mark (even 0) on the first student is guaranteed to be greater than `-1` and update `top` and `topper`", "Because Python requires variables to start at `-1`", "To subtract 1 from the average"], "answer": "Because valid marks are in `[0, 100]`, so any valid mark (even 0) on the first student is guaranteed to be greater than `-1` and update `top` and `topper`", "explanation": "Initializing `top = -1` ensures that even if every student scores `0`, the first student's score (`0 > -1`) properly initializes `topper`."}, {"question": "What makes 153 an Armstrong number?", "options": ["Its proper divisors sum to 153", "It has 3 digits and `1**3 + 5**3 + 3**3 = 1 + 125 + 27 = 153`", "It is divisible only by 1 and 153", "Its digits are in strictly increasing order"], "answer": "It has 3 digits and `1**3 + 5**3 + 3**3 = 1 + 125 + 27 = 153`", "explanation": "A k-digit number is an Armstrong number if the sum of its digits each raised to the k-th power equals the number itself."}, {"question": "Why does the Perfect Number checker (Example 26) only test divisors up to `n // 2`?", "options": ["Because no integer can have a proper divisor (a divisor strictly less than `n`) greater than `n // 2`", "Because numbers above `n // 2` are always prime", "To include `n` itself in the sum", "Because `range()` cannot go up to `n`"], "answer": "Because no integer can have a proper divisor (a divisor strictly less than `n`) greater than `n // 2`", "explanation": "The largest possible proper factor of any integer `n` is `n / 2` (when `n` is even)."}, {"question": "In Example 28 (Password Validator), why is there a `break` statement inside the character loop?", "options": ["To reject the password as soon as a special character is seen", "As an early-exit optimization: once all 4 character classes (upper, lower, digit, special) have been found, scanning the remaining characters is unnecessary", "Because `for` loops require a `break`", "To ensure the password is at most 4 characters long"], "answer": "As an early-exit optimization: once all 4 character classes (upper, lower, digit, special) have been found, scanning the remaining characters is unnecessary", "explanation": "Once all four boolean flags are True, the character-class requirement is satisfied, so `break` avoids redundant iterations."}, {"question": "In Example 27 (`for name, stock, reorder, price in items:`), what Python feature is used in the `for` loop header?", "options": ["List comprehension", "Tuple unpacking", "Dictionary hashing", "Bitwise shifting"], "answer": "Tuple unpacking", "explanation": "Each element of `items` is a 4-tuple, which is unpacked directly into the four loop variables `name, stock, reorder, price`."}]}]}], "instructor": "Prof. Rajendra Hegadi, IIIT Dharwad"},QA={"U2_T2_1": {"io": "No input needed.", "ref": "a,b,c=5,10,15\na,b,c=b,c,a\nprint(a,b,c)", "tests": [""], "o": 1}, "U2_T2_2": {"io": "3 lines: principal, rate (%), time (years).", "ref": "p=float(input());r=float(input());t=float(input())\ns=p*r*t/100\nprint(s,p+s)", "tests": ["1000\n5\n2", "2500\n4.5\n3"], "has": ["#"]}, "U2_T2_3": {"io": "1 line: a candidate name. Print Valid or Invalid.", "ref": "import keyword\ns=input()\nprint('Valid' if s.isidentifier() and not keyword.iskeyword(s) else 'Invalid')", "tests": ["class", "my var", "2x", "_ok", "value"], "v": 1, "has": ["keyword", "isidentifier"]}, "U2_T2_4": {"io": "No input needed.", "ref": "data=7\nprint(data,type(data))\ndata=float(data)/2\nprint(data,type(data))\ndata=f\"{data}\"\nprint(data,type(data))", "tests": [""], "W": 1}, "U2_T3_1": {"io": "1 line: temperature in Celsius.", "ref": "c=float(input())\nprint(c*9/5+32)", "tests": ["37", "-40", "100", "0"]}, "U2_T3_2": {"io": "1 line: a sentence.", "ref": "s=input()\nprint(len(s),s[:3],s[-3:],s.upper())", "tests": ["Python programming", "hello world"], "W": 1}, "U2_T3_3": {"io": "1 line: space-separated words.", "ref": "w=input().split()\nprint(len(w),len(set(w)))", "tests": ["a b a c b", "x x x", "one two three"], "has": ["set"]}, "U2_T3_4": {"io": "1 line: a 3-digit integer, then total seconds.", "ref": "n,s=map(int,input().split())\nprint(sum(map(int,str(n))),s//3600,s%3600//60,s%60)", "tests": ["123 3725", "999 59", "100 7200"]}, "U2_T4_1": {"io": "No input needed.", "ref": "print(5+2*3**2)\nprint((5+2)*3**2)\nprint(18//4+18%4)\nprint(2**2**3)", "tests": [""]}, "U2_T4_2": {"io": "1 line: integers a and b.", "ref": "a,b=map(int,input().split())\nprint(a&b,a|b,a^b,a<<2,b>>1)", "tests": ["12 10", "5 3", "0 7"]}, "U2_T4_3": {"io": "No input needed.", "ref": "L1=[10,20,30];L2=[10,20,30];L3=L1\nprint(L1==L2,L1==L3,L2==L3,L1 is L2,L1 is L3,L2 is L3)\nL1.append(40)\nprint(L1,L2,L3)", "tests": [""], "W": 1}, "U2_T4_4": {"io": "1 line: radius r.", "ref": "import math\nr=float(input())\nprint('VALID' if r>=0 else 'INVALID')\nif r>=0: print(round(math.pi*r*r,2),round(2*math.pi*r,2))", "tests": ["5", "-2", "0", "2.5"], "v": 1, "has": ["if.+else"]}, "U2_T5_1": {"io": "4 lines: x1, y1, x2, y2.", "ref": "from math import sqrt\nx1,y1,x2,y2=[float(input()) for _ in range(4)]\nprint(round(sqrt((x2-x1)**2+(y2-y1)**2),2))", "tests": ["0\n0\n3\n4", "1\n2\n4\n6.5"], "has": ["sqrt"]}, "U2_T5_2": {"io": "1 line: five space-separated marks.", "ref": "m=list(map(float,input().split()))\nprint(sum(m),sum(m)/5,min(m),max(m),sorted(m,reverse=True))", "tests": ["78 85 62 90 71", "50 60 70 80 90"]}, "U2_T5_3": {"io": "No input needed. Print die 1, die 2, their sum, then Heads/Tails.", "ref": "print(1)", "tests": [""], "c":
