"dice", "has": ["random"]}, "U2_T5_4": {"io": "No input needed.", "ref": "items=['Laptop','Mouse','Keyboard'];qs=[1,2,1];ps=[55000,600,1500]\nt=[q*p for q,p in zip(qs,ps)]\nfor i,(n,x) in enumerate(zip(items,t),1): print(i,n,x)\nprint(sum(t))", "tests": [""], "W": 1, "has": ["enumerate", "zip", "sum"]}, "U3_T1_1": {"io": "3 lines: base fare, age, class (sleeper/ac). Print final fare.", "ref": "f=float(input());a=int(input());c=input().strip().lower()\nif a<12: f*=0.5\nelif a>=60: f*=0.6\nif c=='ac': f*=1.2\nprint(round(f,2))", "tests": ["500\n8\nsleeper", "500\n65\nac", "800\n30\nac", "300\n11\nsleeper"]}, "U3_T1_2": {"io": "1 line: annual income. Print the final tax payable (after cess).", "ref": "i=float(input());t=0\nif i>300000: t+=(min(i,600000)-300000)*.05\nif i>600000: t+=(min(i,900000)-600000)*.1\nif i>900000: t+=(i-900000)*.15\nif i<=700000: t=0\nprint(round(t*1.04,2))", "tests": ["250000", "650000", "800000", "1200000"]}, "U3_T1_3": {"io": "1 line: day month year. Print Valid or Invalid.", "ref": "d,m,y=map(int,input().split())\nleap=y%400==0 or (y%4==0 and y%100!=0)\ndim=[31,29 if leap else 28,31,30,31,30,31,31,30,31,30,31]\nprint('Valid' if 1<=m<=12 and 1<=d<=dim[m-1] and y>0 else 'Invalid')", "tests": ["29 2 2024", "29 2 2023", "31 4 2021", "15 8 2020", "29 2 1900", "29 2 2000", "31 13 2020"], "v": 1}, "U3_T1_4": {"io": "3 lines: distance (km), waiting minutes, day/night. Print Invalid for negatives, else the final total.", "ref": "d=float(input());w=float(input());t=input().strip()\nif d<0 or w<0: print('Invalid')\nelse:\n    tr=60+max(0,min(d,10)-2)*14+max(0,d-10)*18\n    if t=='night': tr*=1.2\n    wc=max(0,w-5)*2\n    print(round(tr,2),round(wc,2),round(tr+wc,2))", "tests": ["1\n3\nday", "5\n10\nnight", "15\n8\nnight", "-2\n3\nday"], "v": 1}, "U3_T1_5": {"io": "1 line: five marks. Print Fail, Pass with grace, Pass or Distinction.", "ref": "m=list(map(float,input().split()))\nf=[x for x in m if x<35]\nif len(f)==1 and 30<=f[0]<=34: print('Pass with grace')\nelif f: print('Fail')\nelif all(x>=75 for x in m) and sum(m)/5>=85: print('Distinction')\nelse: print('Pass')", "tests": ["80 90 85 88 92", "40 50 60 70 80", "33 50 60 70 80", "20 50 60 70 80", "33 32 60 70 80"], "k": ["distinction", "grace", "fail", "pass"]}, "U3_T2_1": {"io": "1 line: positive integer n. Print the reversed number and whether it is a palindrome.", "ref": "n=int(input());t=n;r=0\nwhile t>0:\n    r=r*10+t%10;t//=10\nprint(r,'Palindrome' if r==n else 'Not palindrome')", "tests": ["121", "123", "1001", "7", "120"], "v": 1, "has": ["while"], "bad": ["str\\(", "\\[::-1\\]", "reversed"]}, "U3_T2_2": {"io": "1 line: positive integer n. Print every value, then the step count.", "ref": "n=int(input());c=0;print(n)\nwhile n!=1:\n    n=n//2 if n%2==0 else 3*n+1\n    print(n);c+=1\nprint(c)", "tests": ["6", "7", "1", "12"], "has": ["while"]}, "U3_T2_3": {"io": "1 line: integer n >= 2. Print its prime factors.", "ref": "n=int(input());d=2;f=[]\nwhile n>1:\n    while n%d==0: f.append(d);n//=d\n    d+=1\nprint(*f)", "tests": ["60", "97", "84", "2"], "has": ["while"]}, "U3_T2_4": {"io": "Lines of votes (A, B or C), ended by X. Print % per candidate, invalid count, and Winner or Tie.", "ref": "v={'A':0,'B':0,'C':0};bad=0\nwhile True:\n    x=input().strip()\n    if x=='X': break\n    if x in v: v[x]+=1\n    else: bad+=1\nt=sum(v.values())\nfor k in v: print(k,round(v[k]*100/t,2))\nprint(bad)\nm=max(v.values());w=[k for k in v if v[k]==m]\nprint('Tie' if len(w)>1 else 'Winner '+w[0])", "tests": ["A\nB\nA\nZ\nC\nA\nX", "A\nB\nB\nA\nX", "C\nC\nB\nX"], "k": ["tie"], "has": ["while"]}, "U3_T2_5": {"io": "1 line: positive number N. Print the cube root rounded to 2 decimals.", "ref": "N=float(input());x=N/3 if N>1 else 1.0\nwhile True:\n    nx=(2*x+N/(x**2))/3\n    if abs(nx-x)<1e-6: x=nx;break\n    x=nx\nprint(round(x,2))", "tests": ["27", "10", "125", "2"], "has": ["while"]}, "U3_T3_1": {"io": "1 line: space-separated integers. Print the largest and second-largest distinct values.", "ref": "m=sorted(set(map(int,input().split())))\nprint(m[-1],m[-2])", "tests": ["5 3 9 1 9 7", "10 20", "4 4 4 4 3", "-1 -5 -3"], "has": ["for"], "bad": ["max\\(", "sorted\\("]}, "U3_T3_2": {"io": "1 line: a large positive integer. Print \"digit count\" for digits 0 to 9.", "ref": "s=input().strip()\nfor d in '0123456789': print(d,s.count(d))", "tests": ["112233445", "9090900"], "has": ["for"]}, "U3_T3_3": {"io": "1 line: n. Print Floyd's triangle, then the 1/0 triangle, numbers separated by spaces.", "ref": "n=int(input());k=1\nfor i in range(1,n+1):\n    print(*range(k,k+i));k+=i\nfor i in range(1,n+1):\n    print(*[1 if (i+j)%2==0 else 0 for j in range(1,i+1)])", "tests": ["4", "5"], "o": 1, "dg": 1, "has": ["for"]}, "U3_T3_4": {"io": "Line 1: N. Then N lines of N integers. Print main diagonal sum, secondary diagonal sum, then the transposed matrix.", "ref": "n=int(input());A=[list(map(int,input().split())) for _ in range(n)]\nprint(sum(A[i][i] for i in range(n)))\nprint(sum(A[i][n-1-i] for i in range(n)))\nfor r in zip(*A): print(*r)", "tests": ["3\n1 2 3\n4 5 6\n7 8 9", "2\n1 2\n3 4"], "o": 1, "has": ["for"]}, "U3_T3_5": {"io": "Line 1: rows cols. Then the matrix rows. Print \"row col value\" (0-indexed) per saddle point, or No saddle point.", "ref": "r,c=map(int,input().split());A=[list(map(int,input().split())) for _ in range(r)];f=0\nfor i in range(r):\n    for j in range(c):\n        if A[i][j]==min(A[i]) and A[i][j]==max(A[x][j] for x in range(r)): print(i,j,A[i][j]);f=1\nif not f: print('No saddle point')", "tests": ["3 3\n1 2 3\n4 5 6\n7 8 9", "2 3\n3 1 2\n1 4 6"], "k": ["no saddle"], "has": ["for"]}, "U3_T4_1": {"io": "No input needed.", "ref": "print(*[i for i in range(1,31) if i%3 and i%5])", "tests": [""], "o": 1, "has": ["continue"]}, "U3_T4_2": {"io": "1 line: space-separated daily profit/loss values. Day numbers start at 1.", "ref": "m=list(map(int,input().split()))\nfor i,x in enumerate(m,1):\n    if x<0: print(i,x);break\nelse: print('All days profitable!')", "tests": ["5 3 -2 7", "1 2 3", "-4 1", "0 0 -1"], "k": ["all days"], "has": ["for", "break", "else"]}, "U3_T4_3": {"io": "Line 1: N. Then N log lines. On CRITICAL print an alert line containing the word CRITICAL and stop. Finally print INFO count and ERROR count.", "ref": "n=int(input());info=err=0\nfor _ in range(n):\n    s=input()\n    if s=='' or s.startswith('#'): continue\n    if s.startswith('DEBUG'): pass\n    elif s.startswith('CRITICAL'): print('ALERT',s);break\n    elif s.startswith('INFO'): info+=1\n    elif s.startswith('ERROR'): err+=1\nprint(info,err)", "tests": ["6\n# c\nINFO a\n\nDEBUG x\nERROR b\nINFO c", "4\nINFO a\nCRITICAL boom\nERROR x\nINFO b", "3\nERROR e\nERROR f\nINFO g"], "k": ["critical"], "has": ["continue", "pass", "break"]}, "U3_T4_4": {"io": "Line 1: the secret number. Then one guess per line. Print Too high / Too low, Correct on a win, Invalid for rejected guesses, and \"Out of attempts\" after 7 valid tries.", "ref": "s=int(input());seen=set();a=0\nwhile a<7:\n    g=int(input())\n    if g<1 or g>100 or g in seen: print('Invalid');continue\n    seen.add(g);a+=1\n    if g==s: print('Correct');break\n    print('Too high' if g>s else 'Too low')\nelse: print('Out of attempts')", "tests": ["42\n50\n25\n42", "42\n0\n42", "42\n10\n10\n50\n42", "42\n1\n2\n3\n4\n5\n6\n7"], "ev": [["H", "too high"], ["L", "too low"], ["W", "correct|you win|won|congrat|guessed it"], ["F", "out of attempts|game over|you lose|no attempts|ran out|failed"], ["I", "invalid|already|repeat|range|reject"]], "has": ["while", "continue", "break", "else"]}, "U3_T5_1": {"io": "1 line: positive integer n. Print the factorial-digit sum and Strong / Not strong.", "ref": "import math\nn=int(input());t=n;s=0\nwhile t: s+=math.factorial(t%10);t//=10\nprint(s,'Strong' if s==n else 'Not strong')", "tests": ["145", "123", "1", "40585"], "v": 1, "has": ["while"]}, "U3_T5_2": {"io": "1 line: L R. Print only three counts: perfect, abundant, deficient. const NEG=/\b(invalid|reject\w*|error|negative|not|false|fail\w*|weak)\b/i;
const num=(o,dg)=>(o.match(dg?/\d/g:/-?\d+(?:\.\d+)?/g)||[]).map(Number),near=(a,b)=>Math.abs(a-b)<=0.011+1e-9*Math.abs(b);

function cmp(e,u,o){const en=num(e,o.dg),un=num(u,o.dg);

 else{const pool=[...un];for(const x of en){const j=pool.findIndex(y=>near(y,x));if(j<0)return'an expected value is missing or wrong';pool.splice(j,1)}if(un.length>2*en.length+8)return'too many extra numbers printed'}
 const lo=u.toLowerCase();
 if(o.W)for(const w of new Set(e.toLowerCase().match(/[a-z]{3,}/g)||[]))if(!lo.includes(w))return'expected text "'+w+'" is missing';
 if(o.v&&NEG.test(e)!=NEG.test(u))return'wrong Valid/Invalid style verdict';
 if(o.k&&cls(e,o.k)!=cls(u,o.k))return'wrong classification of the result';
 if(o.ev&&evs(e,o.ev)!=evs(u,o.ev))return'sequence of game messages differs';
 for(const w of o.no||[])if(lo.includes(w)&&!e.toLowerCase().includes(w))return'should not print "'+w+'"';return''}
const CUSTOM={bio:o=>{const L=o.trim().split('\n').filter(x=>x.trim());return L.length==3&&/python/i.test(o)?'':'print exactly 3 lines, one mentioning Python'},
 dice:o=>{const n=(o.match(/\d+/g)||[]).map(Number);return/heads|tails/i.test(o)&&n.length>=3&&n[0]>=1&&n[0]<=6&&n[1]>=1&&n[1]<=6&&n.includes(n[0]+n[1],2)?'':'need die1 (1-6), die2 (1-6), their sum, and Heads/Tails'}};

function formatAIExplanation(text){
 const inline=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>');

 const flushList=()=>{if(list){out.push('</'+list+'>');list=''}};
 const flushParagraph=()=>{if(paragraph.length){out.push('<p>'+paragraph.join('<br>')+'</p>');paragraph=[]}};
 for(const line of lines){
  if(/^```/.test(line)){if(code!==null){out.push('<pre><code>'+esc(code.join('\n'))+'</code></pre>');code=null}else{flushParagraph();flushList();code=[]}continue}
  if(code!==null){code.push(line);continue}
  if(math!==null){math.lines.push(line);if(line.includes(math.close)){out.push('<div>'+esc(math.lines.join('\n'))+'</div>');math=null}continue}
  const mathOpen=line.match(/^\s*(\$\$|\\\[)/);
  if(mathOpen){flushParagraph();flushList();const close=mathOpen[1]=='$$'?'$$':'\\]';if(line.slice(line.indexOf(mathOpen[1])+mathOpen[1].length).includes(close)){out.push('<div>'+esc(line.trim())+'</div>')}else{math={close,lines:[line]}}continue}
  if(!line.trim()){flushParagraph();flushList();continue}
  const item=line.match(/^\s*([-*]|\d+[.)])\s+(.+)$/);
  if(item){flushParagraph();const kind=/^\d/.test(item[1])?'ol':'ul';if(list!==kind){flushList();list=kind;out.push('<'+list+'>')}out.push('<li>'+inline(item[2])+'</li>');continue}
  const heading=line.match(/^(#{1,3})\s+(.+)$/);
  if(heading){flushParagraph();flushList();out.push('<h3>'+inline(heading[2])+'</h3>');continue}
  flushList();paragraph.push(inline(line));
 }
 flushParagraph();
 if(math!==null)out.push('<p>'+esc(math.lines.join('\n'))+'</p>');
 if(code!==null)out.push('<pre><code>'+esc(code.join('\n'))+'</code></pre>');
 flushList();
 return out.join('');
}
